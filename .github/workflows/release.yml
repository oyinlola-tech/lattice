name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version and Publish
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Version packages
        run: pnpm changeset version || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version packages" || true
          git push origin main

      - name: Publish packages
        run: |
          # Publish packages one at a time with delay to avoid npm 429 rate limits
          for dir in packages/*/; do
            pkg_json="$dir/package.json"
            if [ -f "$pkg_json" ]; then
              name=$(python3 -c "import json; print(json.load(open('$pkg_json')).get('name',''))" 2>/dev/null)
              if [ -n "$name" ] && [ "$name" != "lattice" ]; then
                private=$(python3 -c "import json; print(json.load(open('$pkg_json')).get('private',False))" 2>/dev/null)
                if [ "$private" = "False" ] || [ "$private" = "false" ]; then
                  echo "Publishing $name from $dir"
                  (cd "$dir" && npm publish --access public 2>&1) || echo "Skip: $name (already published or rate limited)"
                  sleep 5
                fi
              fi
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
