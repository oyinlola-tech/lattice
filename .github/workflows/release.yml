name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version and Publish
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Version packages
        run: pnpm changeset version || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version packages" || true
          git push origin main

      - name: Publish packages
        run: |
          # Publish packages one by one with delays to avoid npm rate limits (429)
          PACKAGES=$(pnpm -r --json 2>/dev/null | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for pkg in data:
              name = pkg.get('name', '')
              if name.startswith('@oyinlola141/'):
                  path = pkg.get('path', '')
                  if path:
                      print(f'{name}\t{path}')
          ")
          
          while IFS=$'\t' read -r name path; do
            echo "Publishing $name from $path"
            (cd "$path" && npm publish --access public 2>&1) || echo "Failed to publish $name (may already exist or rate limited)"
            sleep 3
          done <<< "$PACKAGES"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
