<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Zudo Logo — Brutalist Style -->
  <!-- Works for: favicon, OpenAPI, Swagger, Postman, docs header -->
  
  <!-- Red block behind Z -->
  <rect x="0" y="0" width="80" height="80" fill="#FF0000" stroke="#000000" stroke-width="4"/>
  
  <!-- Z letterform -->
  <path d="M16 20h48l-48 40h48" stroke="#000000" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  
  <!-- ZUDO text -->
  <text x="96" y="56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="48" font-weight="900" fill="#000000" letter-spacing="-2">ZUDO</text>
  
  <!-- Bottom accent line -->
  <rect x="0" y="76" width="320" height="4" fill="#FFFF00"/>
</svg>